<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Construct-Zone &mdash; Under Construction</title>
  <style>
    :root {
      --bg: #0b132b;
      --panel: #1c2541;
      --accent: #5bc0eb;
      --accent-2: #00add8;
      --text: #e0e6f0;
      --muted: #9aa6c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1c2541 0%, var(--bg) 70%);
      color: var(--text);
      padding: 2rem;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid rgba(91, 192, 235, 0.25);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 2.4rem;
      letter-spacing: 0.5px;
    }
    .tag {
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.85rem;
    }
    .description {
      color: var(--muted);
      line-height: 1.6;
      margin: 1.25rem auto 1.75rem;
      max-width: 520px;
    }
    pre.gopher {
      color: var(--accent-2);
      font-size: 0.7rem;
      line-height: 1.05;
      text-align: left;
      display: inline-block;
      margin: 0 auto 1.75rem;
      overflow-x: auto;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .stat {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid rgba(154, 166, 192, 0.15);
      border-radius: 12px;
      padding: 1rem;
    }
    .stat .label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .stat .value {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }
    footer {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Construct-Zone</span>
    <h1>We're Building Something Great</h1>
    <pre class="gopher" aria-label="Go gopher mascot">{{ .Gopher }}</pre>
    <p class="description">{{ .Description }}</p>

    <section class="stats">
      <div class="stat">
        <span class="label">Visitor #</span>
        <span class="value">{{ .VisitorCount }}</span>
      </div>
      <div class="stat">
        <span class="label">Domain</span>
        <span class="value">{{ .Domain }}</span>
      </div>
      <div class="stat">
        <span class="label">Uptime</span>
        <span class="value">{{ .Uptime }}</span>
      </div>
      <div class="stat">
        <span class="label">Server Time (UTC)</span>
        <span class="value">{{ .CurrentTime }}</span>
      </div>
    </section>

    <footer>Powered by {{ .GoVersion }} &middot; html/template</footer>
  </main>
</body>
</html>

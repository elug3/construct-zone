<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Construct-Zone &mdash; Under Construction</title>
  <style>
    :root {
      --bg: #0b132b;
      --panel: #1c2541;
      --accent: #5bc0eb;
      --accent-2: #00add8;
      --text: #e0e6f0;
      --muted: #9aa6c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1c2541 0%, var(--bg) 70%);
      color: var(--text);
      padding: 2rem;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid rgba(91, 192, 235, 0.25);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 2.4rem;
      letter-spacing: 0.5px;
    }
    .tag {
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.85rem;
    }
    .description {
      color: var(--muted);
      line-height: 1.6;
      margin: 1.25rem auto 1.75rem;
      max-width: 520px;
    }
    pre.gopher {
      color: var(--accent-2);
      font-size: 0.7rem;
      line-height: 1.05;
      text-align: left;
      display: inline-block;
      margin: 0 auto 1.75rem;
      overflow-x: auto;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .stat {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid rgba(154, 166, 192, 0.15);
      border-radius: 12px;
      padding: 1rem;
    }
    .stat .label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .stat .value {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }
    footer {
      margin-top: 1.75rem;
      color: var(--muted);
      display: flex;
      justify-content: center;
    }
    .github-link {
      color: var(--muted);
      display: inline-flex;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .github-link:hover,
    .github-link:focus-visible {
      color: var(--accent);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Construct-Zone</span>
    <h1>We're Building Something Great</h1>
    <pre class="gopher" aria-label="Go gopher mascot">{{ .Gopher }}</pre>
    <p class="description">{{ .Description }}</p>

    <section class="stats">
      <div class="stat">
        <span class="label">Visitor #</span>
        <span class="value">{{ .VisitorCount }}</span>
      </div>
      <div class="stat">
        <span class="label">Domain</span>
        <span class="value">{{ .Domain }}</span>
      </div>
      <div class="stat">
        <span class="label">Uptime</span>
        <span class="value" id="uptime-value">{{ .Uptime }}</span>
      </div>
      <div class="stat">
        <span class="label">Server Time (UTC)</span>
        <span class="value" id="time-value">{{ .CurrentTime }}</span>
      </div>
    </section>

    <footer>
      <a class="github-link" href="{{ .GitHubURL }}" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub" title="View source on GitHub">
        <svg viewBox="0 0 16 16" width="28" height="28" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.76-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
      </a>
    </footer>
  </main>

  <script>
    (function () {
      var startUnix = {{ .StartUnix }};
      var serverNowUnix = {{ .ServerNowUnix }};
      // Offset (in seconds) between the server clock and this browser's clock,
      // so the ticking values stay aligned to the server even if the client
      // clock is skewed.
      var offset = serverNowUnix - Math.floor(Date.now() / 1000);

      var uptimeEl = document.getElementById("uptime-value");
      var timeEl = document.getElementById("time-value");

      var weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      function pad(n) {
        return n < 10 ? "0" + n : "" + n;
      }

      function unit(value, name) {
        return value + " " + name + (value !== 1 ? "s" : "");
      }

      function humanizeUptime(totalSeconds) {
        totalSeconds = Math.max(0, Math.floor(totalSeconds));
        var days = Math.floor(totalSeconds / 86400);
        totalSeconds -= days * 86400;
        var hours = Math.floor(totalSeconds / 3600);
        totalSeconds -= hours * 3600;
        var minutes = Math.floor(totalSeconds / 60);
        totalSeconds -= minutes * 60;
        var seconds = totalSeconds;

        var parts = [];
        if (days > 0) parts.push(unit(days, "day"));
        if (hours > 0) parts.push(unit(hours, "hour"));
        if (minutes > 0) parts.push(unit(minutes, "minute"));
        parts.push(unit(seconds, "second"));
        return parts.join(" ");
      }

      function formatUTC(unixSeconds) {
        var d = new Date(unixSeconds * 1000);
        return weekdays[d.getUTCDay()] + ", " + pad(d.getUTCDate()) + " " +
          months[d.getUTCMonth()] + " " + d.getUTCFullYear() + " " +
          pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" +
          pad(d.getUTCSeconds()) + " UTC";
      }

      function tick() {
        var serverNow = Math.floor(Date.now() / 1000) + offset;
        if (uptimeEl) uptimeEl.textContent = humanizeUptime(serverNow - startUnix);
        if (timeEl) timeEl.textContent = formatUTC(serverNow);
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
